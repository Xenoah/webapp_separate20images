<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隙間トリム写真分割</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* layout: one column tool. preview on top (sticky-free), settings below, pieces row at the end */
:root{
  --bg:#eef1f0; --panel:#ffffff; --ink:#16211f; --muted:#5d6c69; --line:#cfd8d5;
  --accent:#0b7a6b; --accent-ink:#ffffff; --gapcolor:#0d1413; --warn:#b3401f;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --font-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --panel:#18211f; --ink:#e8efed; --muted:#93a39f; --line:#2c3a37;
    --accent:#43cdb6; --accent-ink:#06211c; --gapcolor:#000000; --warn:#ff9470;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#18211f; --ink:#e8efed; --muted:#93a39f; --line:#2c3a37;
  --accent:#43cdb6; --accent-ink:#06211c; --gapcolor:#000000; --warn:#ff9470;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:900;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.04em}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
button,.filebtn{font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,.filebtn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.filebtn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn{position:relative}
.stage{background:var(--gapcolor);border-radius:8px;padding:10px;display:flex;justify-content:center;overflow:hidden}
#preview{display:block;max-width:100%;max-height:70vh;height:auto;width:auto}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-weight:700;font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
input[type=range]{flex:1 1 160px;min-width:0;accent-color:var(--accent);height:32px}
input[type=number],select{max-width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px;font-variant-numeric:tabular-nums}
input[type=number]{width:84px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg label{padding:8px 14px;cursor:pointer;font-weight:500;min-height:40px;display:flex;align-items:center}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:var(--accent-ink)}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:700}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:34px;padding:4px 12px;font-weight:500;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:0}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.pieces{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-width:0}
.piece{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.piece img{display:block;height:170px;width:auto;max-width:260px;object-fit:contain;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.piece button{min-height:34px;padding:4px 10px;font-size:13px}
#msg{font-size:13px;min-height:1.6em;margin:0}
#msg.err{color:var(--warn)}
.mobile-strip{display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;height:min(54vh,360px);background:var(--gapcolor);border-radius:8px;min-width:0;overscroll-behavior-x:contain}
.mobile-strip img{display:block;height:100%;width:auto;max-width:none;flex:0 0 auto}
#pieces[aria-busy="true"]{opacity:.45;pointer-events:none}
#pieces[aria-busy="true"] img{-webkit-touch-callout:none;visibility:hidden}
@media(max-width:380px){main{padding:16px 12px 32px}.panel{padding:12px}.seg label{padding:8px 10px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>隙間トリム写真分割</h1>
    <div class="row"><button type="button" id="testBtn">○テスト画像</button><label class="filebtn">写真を選ぶ<input type="file" id="file" accept="image/*"></label></div>
  </header>

  <section class="panel" aria-label="プレビュー">
    <h2>並べたときの見え方</h2>
    <label class="switch"><input type="checkbox" id="mobilePreview" checked>スマホ横スクロールで確認</label>
    <p class="hint" id="previewHint">左右にスワイプして継ぎ目を確認できます。設定した隙間での見え方です。</p>
    <div class="mobile-strip" id="mobileStrip" aria-label="横スクロールプレビュー" tabindex="0"></div>
    <div class="stage" id="overview"><canvas id="preview" width="800" height="340"></canvas></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="panel" aria-label="設定">
    <div class="field">
      <label for="nRange">分割数</label>
      <div class="row">
        <input type="range" id="nRange" min="2" max="50" step="1" value="5">
        <input type="number" id="nNum" aria-label="分割数（数値）" min="2" max="50" step="1" value="5" inputmode="numeric">
      </div>
    </div>

    <div class="field">
      <span class="lab">並べる向き</span>
      <div class="seg" role="radiogroup" aria-label="並べる向き">
        <label><input type="radio" name="dir" id="dirH" value="h" checked><span>横に並べる</span></label>
        <label><input type="radio" name="dir" id="dirV" value="v"><span>縦に並べる</span></label>
      </div>
    </div>

    <div class="field">
      <label for="gapRange">隙間の幅</label>
      <div class="row">
        <input type="range" id="gapRange" min="0" max="100" step="0.5" value="8">
        <input type="number" id="gapNum" aria-label="隙間の幅（数値）" min="0" step="0.5" value="8" inputmode="decimal">
        <select id="gapUnit" aria-label="隙間の単位">
          <option value="pct">%（1枚の幅に対して）</option>
          <option value="px">px（元画像）</option>
        </select>
      </div>
      <div class="chips" id="presets">
        <button type="button" data-g="1">細め 1%</button>
        <button type="button" data-g="4">中 4%</button>
        <button type="button" data-g="8">広め 8%</button>
      </div>
      <p class="hint">8%は調整の出発点です。Xのアプリ・端末・表示方法で隙間は変わります。実際の表示で○の継ぎ目が合うように調整してください。</p>
    </div>

    <div class="field">
      <label class="switch"><input type="checkbox" id="trim" checked>隙間の分を切り取る</label>
      <p class="hint" id="trimHint"></p>
    </div>

    <div class="field">
      <label for="fmt">保存形式</label>
      <div class="row">
        <select id="fmt">
          <option value="jpg">JPEG（高画質）</option>
          <option value="png">PNG（無劣化）</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="保存">
    <div class="row" style="justify-content:space-between">
      <h2>分割した画像</h2>
      <button type="button" class="primary" id="zipBtn" hidden>ZIPでまとめて保存</button>
    </div>
    <button type="button" id="shareBtn" hidden>画像をまとめて共有</button>
    <div class="row" id="seqRow" hidden>
      <button type="button" class="primary" id="seqBtn">1枚目から順番に保存</button>
      <label for="seqInt">間隔</label>
      <select id="seqInt">
        <option value="0.5">0.5秒</option>
        <option value="1" selected>1秒</option>
        <option value="2">2秒</option>
        <option value="3">3秒</option>
        <option value="5">5秒</option>
      </select>
    </div>
    <div class="pieces" id="pieces"></div>
    <p class="hint" id="saveHint">スマホはZIP保存または共有を利用できます。連続ダウンロードは端末によって制限されます。</p>
    <p id="msg" role="status"></p>
  </section>
</main>

<script src="split-core.js"></script>
<script src="circle-pattern.js"></script>
<script src="app.js"></script>
</body>
</html>
